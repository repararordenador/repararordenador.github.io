    (function initParticles() {
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      let width, height;
      let particles = [];
      const PARTICLE_COUNT = 110;
      const CONNECTION_DIST = 150;

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
      }
      window.addEventListener('resize', resize);
      resize();

      class Particle {
        constructor() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.vx = (Math.random() - 0.5) * 1.2;
          this.vy = (Math.random() - 0.5) * 1.2;
          this.radius = Math.random() * 2.5 + 1.5;
          this.opacity = Math.random() * 0.6 + 0.2;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          if (this.x < 0 || this.x > width) this.vx *= -1;
          if (this.y < 0 || this.y > height) this.vy *= -1;
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(148, 163, 184, ${this.opacity})`;
          ctx.fill();
        }
      }

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(new Particle());
      }

      function drawLines() {
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < CONNECTION_DIST) {
              const alpha = (1 - dist / CONNECTION_DIST) * 0.25;
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(148, 163, 184, ${alpha})`;
              ctx.lineWidth = 0.8;
              ctx.stroke();
            }
          }
        }
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => {
          p.update();
          p.draw();
        });
        drawLines();
        requestAnimationFrame(animate);
      }
      animate();
    })();

    // =============================================================
    // 3. LÓGICA DE RENDER, FILTROS, MODO OSCURO
    // =============================================================
    const grid = document.getElementById('grid');
    const searchInput = document.getElementById('searchInput');
    const filterButtons = document.querySelectorAll('.filter-btn');
    const resultsCount = document.getElementById('resultsCount');
    const themeToggle = document.getElementById('themeToggle');

    let currentCategory = 'all';
    let searchTerm = '';

    function render() {
      const filtered = programas.filter(item => {
        const matchCategory = currentCategory === 'all' || item.categoria === currentCategory;
        const term = searchTerm.toLowerCase().trim();
        const matchSearch = term === '' ||
          item.nombre.toLowerCase().includes(term) ||
          item.descrip.toLowerCase().includes(term);
        return matchCategory && matchSearch;
      });

      resultsCount.textContent = `${filtered.length} ${filtered.length === 1 ? 'programa' : 'programas'}`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: #94a3b8;">
            <i class="fas fa-search" style="font-size: 2.5rem; display: block; margin-bottom: 1rem;"></i>
            <p style="font-size: 1.1rem;">No encontramos programas con esos criterios.</p>
            <p style="font-size: 0.9rem;">Prueba con otra búsqueda o categoría.</p>
          </div>
        `;
        return;
      }

      let html = '';
      filtered.forEach(prog => {
        html += `
          <div class="card" data-category="${prog.categoria}">
            <div class="icon"><i class="${prog.icono}"></i></div>
            <span class="category-badge">${prog.categoria}</span>
            <h3>${prog.nombre}</h3>
            <p>${prog.descrip}</p>
            <a href="${prog.url}" target="_blank" rel="noopener noreferrer" class="btn-link">
              Sitio oficial <i class="fas fa-arrow-right"></i>
            </a>
          </div>
        `;
      });
      grid.innerHTML = html;
    }

    searchInput.addEventListener('input', (e) => {
      searchTerm = e.target.value;
      render();
    });

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.category;
        render();
      });
    });

    // Modo oscuro / claro (el fondo de partículas no se ve afectado, pero cambiamos el estilo base)
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      themeToggle.innerHTML = isDark
        ? '<i class="fas fa-sun"></i> <span>Modo claro</span>'
        : '<i class="fas fa-moon"></i> <span>Modo oscuro</span>';
      localStorage.setItem('darkMode', isDark ? 'true' : 'false');
      // Ajustar fondo del body según modo (ya que el canvas es fijo)
      if (isDark) {
        document.body.style.background = '#0b1120';
      } else {
        document.body.style.background = '#f4f7fc';
      }
    });

    // Cargar preferencia de modo oscuro
    (function loadTheme() {
      const saved = localStorage.getItem('darkMode');
      if (saved === 'true') {
        document.body.classList.add('dark');
        document.body.style.background = '#0b1120';
        themeToggle.innerHTML = '<i class="fas fa-sun"></i> <span>Modo claro</span>';
      } else {
        document.body.style.background = '#f4f7fc';
      }
    })();

    render();
  </script>
